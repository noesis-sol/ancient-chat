name: Check

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Typecheck, lint, tests and build. The build fills in a placeholder
      # Clerk publishable key when it is unset (see scripts/check-build.mjs),
      # so its output must not be deployed.
      - run: npm run check
